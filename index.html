<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올와티 (olwaty) - 팬과 진짜로 연결되는 순간</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            background-color: #000000;
            margin: 0;
            overflow-x: hidden;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        .animate-pulse-glow {
            animation: pulse-glow 4s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 6s infinite ease-in-out;
        }

        @keyframes scroll-x {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-scroll-x {
            display: flex;
            width: max-content;
            animation: scroll-x 20s linear infinite;
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.4);
        }

        @keyframes progress-sweep {
            0% {
                transform: translateX(-35%);
            }
            50% {
                transform: translateX(15%);
            }
            100% {
                transform: translateX(-35%);
            }
        }

        .animate-progress-sweep {
            animation: progress-sweep 2.6s ease-in-out infinite;
        }

        @keyframes heading-shift {
            0% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.18);
            }
            100% {
                filter: brightness(1);
            }
        }

        .animate-gradient-heading {
            animation: heading-shift 3s ease-in-out infinite;
        }

        @keyframes heading-unify {
            0% {
                transform: translateY(0);
                text-shadow: 0 0 0 rgba(167, 139, 250, 0);
            }
            50% {
                transform: translateY(-2px);
                text-shadow: 0 0 18px rgba(167, 139, 250, 0.25);
            }
            100% {
                transform: translateY(0);
                text-shadow: 0 0 0 rgba(167, 139, 250, 0);
            }
        }

        .animate-heading-unify {
            animation: heading-unify 3.2s ease-in-out infinite;
            will-change: transform, text-shadow;
        }

        @keyframes cta-glow {
            0% {
                box-shadow: 0 0 0 rgba(167, 139, 250, 0);
            }
            50% {
                box-shadow: 0 0 40px rgba(167, 139, 250, 0.25);
            }
            100% {
                box-shadow: 0 0 0 rgba(167, 139, 250, 0);
            }
        }

        .animate-cta-glow {
            animation: cta-glow 2.8s ease-in-out infinite;
        }

        @keyframes input-sweep {
            0% {
                opacity: 0.2;
                box-shadow: inset 0 0 0 0 rgba(167, 139, 250, 0);
            }
            50% {
                opacity: 0.7;
                box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.35);
            }
            100% {
                opacity: 0.2;
                box-shadow: inset 0 0 0 0 rgba(167, 139, 250, 0);
            }
        }

        .animate-input-sweep {
            animation: input-sweep 2.2s ease-in-out infinite;
        }

        @keyframes input-glow {
            0% {
                box-shadow: 0 0 0 rgba(167, 139, 250, 0.08), 0 10px 30px rgba(0, 0, 0, 0.35);
            }
            50% {
                box-shadow: 0 0 22px rgba(167, 139, 250, 0.26), 0 10px 30px rgba(0, 0, 0, 0.35);
            }
            100% {
                box-shadow: 0 0 0 rgba(167, 139, 250, 0.08), 0 10px 30px rgba(0, 0, 0, 0.35);
            }
        }

        .animate-input-glow {
            animation: input-glow 2.8s ease-in-out infinite;
        }

        @keyframes button-breathe {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-1px);
            }
            100% {
                transform: translateY(0);
            }
        }

        .animate-button-breathe {
            animation: button-breathe 2s ease-in-out infinite;
        }

        @keyframes success-ripple {
            0% {
                box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.38);
            }
            100% {
                box-shadow: 0 0 0 24px rgba(167, 139, 250, 0);
            }
        }

        .animate-success-ripple {
            animation: success-ripple 950ms ease-out 1;
        }

        @keyframes glow-soft {
            0% {
                box-shadow: 0 0 0 rgba(167, 139, 250, 0.02);
            }
            50% {
                box-shadow: 0 0 30px rgba(167, 139, 250, 0.18);
            }
            100% {
                box-shadow: 0 0 0 rgba(167, 139, 250, 0.02);
            }
        }

        .animate-glow-soft {
            animation: glow-soft 3s ease-in-out infinite;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
